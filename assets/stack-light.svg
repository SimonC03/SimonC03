<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" width="960" height="504" role="img">
  <title>Stack</title>
  <style>@font-face { font-family: "FG"; font-weight: 400 700; src: url(data:font/woff;base64,) format("woff"); }
    text { font-family: "FG", "Helvetica Neue", Arial, sans-serif; }</style>
  <text x="0.0" y="110.0" font-size="48" font-weight="600" fill="#1F2328" style="letter-spacing:-0.03em">Stack</text>
  <text x="0.0" y="172.0" font-size="18" font-weight="500" fill="#59636E">AI and data</text>
  <text x="0.0" y="212.0" font-size="22" font-weight="400" fill="#1F2328">Python</text>
  <text x="0.0" y="244.0" font-size="22" font-weight="400" fill="#1F2328">pandas</text>
  <text x="0.0" y="276.0" font-size="22" font-weight="400" fill="#1F2328">scikit-learn</text>
  <text x="0.0" y="308.0" font-size="22" font-weight="400" fill="#1F2328">Time-series forecasting</text>
  <text x="0.0" y="340.0" font-size="22" font-weight="400" fill="#1F2328">RAG</text>
  <text x="0.0" y="372.0" font-size="22" font-weight="400" fill="#1F2328">MCP and AI agents</text>
  <text x="320.0" y="172.0" font-size="18" font-weight="500" fill="#59636E">Product</text>
  <text x="320.0" y="212.0" font-size="22" font-weight="400" fill="#1F2328">TypeScript</text>
  <text x="320.0" y="244.0" font-size="22" font-weight="400" fill="#1F2328">Next.js</text>
  <text x="320.0" y="276.0" font-size="22" font-weight="400" fill="#1F2328">React</text>
  <text x="320.0" y="308.0" font-size="22" font-weight="400" fill="#1F2328">Node.js</text>
  <text x="320.0" y="340.0" font-size="22" font-weight="400" fill="#1F2328">SQL</text>
  <text x="640.0" y="172.0" font-size="18" font-weight="500" fill="#59636E">Infrastructure</text>
  <text x="640.0" y="212.0" font-size="22" font-weight="400" fill="#1F2328">Docker</text>
  <text x="640.0" y="244.0" font-size="22" font-weight="400" fill="#1F2328">Google Cloud</text>
  <text x="640.0" y="276.0" font-size="22" font-weight="400" fill="#1F2328">AWS</text>
  <text x="0.0" y="448.0" font-size="22" font-weight="400" fill="#59636E">My background is in automation and mechatronics, which is why the header is a</text>
  <text x="0.0" y="480.0" font-size="22" font-weight="400" fill="#59636E">CAN bus frame: its eight data bytes spell my handle.</text>
