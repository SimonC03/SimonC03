<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 542" width="960" height="542" role="img">
  <title>Work</title>
  <style>@font-face { font-family: "FG"; font-weight: 400 700; src: url(data:font/woff;base64,) format("woff"); }
    text { font-family: "FG", "Helvetica Neue", Arial, sans-serif; }</style>
  <text x="0.0" y="110.0" font-size="48" font-weight="600" fill="#F0F6FC" style="letter-spacing:-0.03em">Work</text>
  <text x="0.0" y="188.0" font-size="34" font-weight="600" fill="#F0F6FC" style="letter-spacing:-0.02em">CampusLyan</text>
  <text x="0.0" y="220.0" font-size="18" font-weight="500" fill="#9198A1">2025 – now</text>
  <text x="330.0" y="188.0" font-size="22" font-weight="600" fill="#F0F6FC">Co-founder and CEO</text>
  <text x="330.0" y="222.0" font-size="22" font-weight="400" fill="#F0F6FC">Student housing platform. I own the architecture and much of the</text>
  <text x="330.0" y="254.0" font-size="22" font-weight="400" fill="#F0F6FC">code, and the partnerships with some of Sweden&#x27;s largest housing</text>
  <text x="330.0" y="286.0" font-size="22" font-weight="400" fill="#F0F6FC">companies.</text>
  <text x="0.0" y="354.0" font-size="34" font-weight="600" fill="#F0F6FC" style="letter-spacing:-0.02em">Chalmers</text>
  <text x="0.0" y="386.0" font-size="18" font-weight="500" fill="#9198A1">2026 – 2028</text>
  <text x="330.0" y="354.0" font-size="22" font-weight="600" fill="#F0F6FC">M.Sc. Data Science &amp; AI</text>
  <text x="0.0" y="450.0" font-size="34" font-weight="600" fill="#F0F6FC" style="letter-spacing:-0.02em">Volvo Buses</text>
  <text x="0.0" y="482.0" font-size="18" font-weight="500" fill="#9198A1">Most recently</text>
  <text x="330.0" y="450.0" font-size="22" font-weight="600" fill="#F0F6FC">Applied AI and machine learning</text>
  <text x="330.0" y="484.0" font-size="22" font-weight="400" fill="#F0F6FC">MCP servers and AI agent tooling, and forecasting models on</text>
  <text x="330.0" y="516.0" font-size="22" font-weight="400" fill="#F0F6FC">large-scale bus time-series data.</text>
</svg>
